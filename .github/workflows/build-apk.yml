name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Pull Buildozer Docker image
        run: |
          docker pull kivy/buildozer:latest

      - name: Accept Android SDK licenses
        run: |
          docker run --rm -i \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            kivy/buildozer:latest \
            bash -c "yes | sdkmanager --licenses || true"

      - name: Build APK
        run: |
          docker run --rm -i \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            kivy/buildozer:latest \
            android debug

      - name: Check APK
        run: |
          echo "Checking for APK..."
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-attendance-apk
          path: bin/*.apk
          if-no-files-found: error
