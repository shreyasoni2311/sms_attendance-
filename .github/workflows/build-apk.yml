name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Clean old Buildozer cache
      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      # 3. Pull official Kivy Buildozer Docker image
      - name: Pull Kivy Buildozer image
        run: |
          docker pull kivy/buildozer:latest

      # 4. Build APK
      - name: Build APK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            kivy/buildozer:latest \
            android debug

      # 5. Show generated APK
      - name: Check APK
        run: |
          echo "Generated APK files:"
          find bin -type f -name "*.apk" -print

      # 6. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-attendance-apk
          path: bin/*.apk
          if-no-files-found: error
