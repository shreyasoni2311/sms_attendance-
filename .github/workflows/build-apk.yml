name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          which sdkmanager
          sdkmanager --version

          echo "Build tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo "Platforms:"
          ls -la "$ANDROID_HOME/platforms"

          test -f "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo "AIDL found successfully."

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Check buildozer.spec
        run: |
          echo "========== buildozer.spec =========="
          cat buildozer.spec
          echo "========== SECTIONS =========="
          grep -n "^\[" buildozer.spec

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        env:
         ANDROIDSDK: ${{ env.ANDROID_HOME }}
         ANDROIDSDKROOT: ${{ env.ANDROID_HOME }}
        ANDROIDAPI: "34"
        ANDROIDMINAPI: "21"
         run: |
           buildozer -v android debug

      - name: Find APK
        run: |
          echo "========== APK FILES =========="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-attendance-apk
          path: bin/*.apk
          if-no-files-found: error
